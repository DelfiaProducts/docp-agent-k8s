# k8s-orya-chart/templates/serviceaccount.yaml
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "k8s-orya.labels" . | nindent 4 }}
  annotations:
    # Must exist before pre-install hook jobs (cert-manager-check, validate-rate-limit).
    # Lower weight ensures SA is created first, then RBAC (weight -1), then hook jobs (weight 0).
    helm.sh/hook: "pre-install,pre-upgrade"
    helm.sh/hook-weight: "-2"
    helm.sh/resource-policy: adopt
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Values.namespace }}
{{- end }}
