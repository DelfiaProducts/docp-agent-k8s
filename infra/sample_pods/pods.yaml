apiVersion: apps/v1 # This should be apps/v1, not just v1
kind: Deployment
metadata:
  name: app1
  namespace: docp-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: nginx:latest
          ports:
            - containerPort: 80
          env:
            - name: TESTE_ENV
              value: "TESTE_ENV_VALUE"
---
apiVersion: apps/v1 # This should be apps/v1, not just v1
kind: Deployment
metadata:
  name: app2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: nginx:latest
          ports:
            - containerPort: 80
          env:
            - name: TESTE_ENV
              value: "TESTE_ENV_VALUE"
